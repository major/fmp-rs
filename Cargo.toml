[package]
name = "rusty-fmp"
version = "0.4.2"
edition = "2024"
rust-version = "1.95"
description = "JSON CLI and client library for Financial Modeling Prep"
license = "MIT"
repository = "https://github.com/major/fmp-rs"
homepage = "https://github.com/major/fmp-rs"
documentation = "https://docs.rs/rusty-fmp"
readme = "README.md"
keywords = ["fmp", "finance", "stocks", "cli", "api"]
categories = ["api-bindings", "command-line-utilities"]

[[bin]]
name = "fmp-agent"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:dotenvy", "dep:jiff", "dep:env_logger", "dep:clap-verbosity-flag", "dep:human-panic", "dep:clap_complete"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15", optional = true }
env_logger = { version = "0.11", optional = true }
clap-verbosity-flag = { version = "3.0", optional = true }
clap_complete = { version = "4.6", optional = true }
human-panic = { version = "2.0", optional = true }
jiff = { version = "0.2", optional = true }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
httpmock = "=0.8.3"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[lints.rust]
unused = { level = "deny", priority = -1 }

# The profile that cargo-dist builds with.
[profile.dist]
inherits = "release"
lto = "thin"
