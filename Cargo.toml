[package]
name = "rusty-fmp"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "JSON CLI and client library for Financial Modeling Prep"
license = "MIT"
repository = "https://github.com/major/fmp-rs"
readme = "README.md"

[[bin]]
name = "fmp-agent"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:dotenvy", "dep:jiff"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15", optional = true }
jiff = { version = "0.2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
httpmock = "=0.8.3"

[lints.rust]
unused = { level = "deny", priority = -1 }

# The profile that cargo-dist builds with.
[profile.dist]
inherits = "release"
lto = "thin"
